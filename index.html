<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air Canvas ✦</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header>
        <div class="title-row">
            <div class="logo">✦</div>

            <div>
                <h1>Air Canvas</h1>
                <p>Draw in the air with your hand</p>
            </div>
        </div>
    </header>


    <!-- CANVAS AREA -->
    <main class="stage">

        <video
            id="video"
            autoplay
            playsinline>
        </video>

        <canvas id="drawCanvas"></canvas>
        <canvas id="cursorCanvas"></canvas>


        <!-- STATUS MESSAGE -->
        <div id="message">
            Starting camera...
        </div>


        <!-- HUD -->
        <div class="hud">

            <div class="status-card" id="handStatus">
                <span class="dot red"></span>
                No Hand
            </div>

            <div class="status-card" id="toolStatus">
                ✦ Pen
            </div>

        </div>


        <!-- TOP RIGHT -->
        <div class="live-badge">
            <span></span>
            LIVE
        </div>

    </main>


    <!-- CONTROLS -->
    <section class="controls">


        <!-- COLORS -->
        <div class="control-section">

            <div class="section-title">
                🎨 Colors
            </div>

            <div class="palette">

                <button
                    class="color active"
                    data-color="#ff3b30"
                    style="background:#ff3b30;">
                </button>

                <button
                    class="color"
                    data-color="#ff9500"
                    style="background:#ff9500;">
                </button>

                <button
                    class="color"
                    data-color="#ffcc00"
                    style="background:#ffcc00;">
                </button>

                <button
                    class="color"
                    data-color="#34c759"
                    style="background:#34c759;">
                </button>

                <button
                    class="color"
                    data-color="#007aff"
                    style="background:#007aff;">
                </button>

                <button
                    class="color"
                    data-color="#af52de"
                    style="background:#af52de;">
                </button>

                <button
                    class="color"
                    data-color="#ff2d55"
                    style="background:#ff2d55;">
                </button>

                <button
                    class="color"
                    data-color="#ffffff"
                    style="background:#ffffff;">
                </button>

            </div>

        </div>


        <!-- TOOLS -->
        <div class="control-section">

            <div class="section-title">
                🖌️ Brush
            </div>

            <div class="tools">

                <button
                    id="penTool"
                    class="tool active">
                    ✦ Pen
                </button>

                <button
                    id="flowerTool"
                    class="tool">
                    🌸 Flower
                </button>

            </div>

        </div>


        <!-- BRUSH SIZE -->
        <div class="control-section brush-section">

            <div class="brush-label">
                <span>Size</span>

                <strong id="brushValue">
                    8
                </strong>
            </div>

            <input
                type="range"
                id="brushSize"
                min="2"
                max="40"
                value="8">

        </div>


        <!-- ACTIONS -->
        <div class="control-section">

            <div class="section-title">
                ⚡ Actions
            </div>

            <div class="actions">

                <button id="undoBtn">
                    ↩ Undo
                </button>

                <button id="redoBtn">
                    ↪ Redo
                </button>

                <button id="clearBtn">
                    🗑 Clear
                </button>

                <button id="saveBtn">
                    💾 Save
                </button>

            </div>

        </div>

    </section>


    <!-- HELP -->
    <div class="help">

        <div>
            ☝️ <strong>Draw</strong>
        </div>

        <div>
            ✌️ <strong>Erase</strong>
        </div>

        <div>
            🖐️ <strong>Pause</strong>
        </div>

        <div>
            <kbd>Ctrl</kbd> + <kbd>Z</kbd>
            Undo
        </div>

    </div>

</div>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<!-- YOUR SCRIPT -->

<script src="script.js"></script>

</body>
</html>
